base_url = "https://elchintoyirov.uz"
title = "Elchin Toyirov"
description = "A software engineer's notebook: what I build, what breaks, and what I learn fixing it."
author = "Elchin Toyirov"
default_language = "en"

compile_sass = true
theme = "kita"
minify_html = true

taxonomies = [{ name = "tags", feed = true, paginate_by = 5 }]

generate_feeds = true
feed_filenames = ["atom.xml"]
feed_limit = 20

exclude_paginated_pages_in_sitemap = "all"

[markdown]
github_alerts = true
insert_anchor_links = "heading"
smart_punctuation = true
bottom_footnotes = true
external_links_target_blank = true
external_links_no_referrer = true
lazy_async_image = true

[markdown.highlighting]
style = "class"
light_theme = "light-plus"
dark_theme = "dark-plus"
error_on_missing_language = true

[link_checker]
skip_prefixes = ["https://www.linkedin.com/"]

[extra]
comment = false
side_toc = true
social_image = "og-image.png"

[extra.footer]
since = 2026
license = "CC BY 4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"

[extra.profile]
name = "Elchin Toyirov"
bio = "Backend engineer in Tashkent — Python, fintech and SaaS"
avatar_url = "avatar.svg"
avatar_invert = true

[[extra.profile.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/elchintoyirov/"


[[extra.profile.social]]
name = "github"
url = "https://github.com/elchintoyirov"

[[extra.profile.social]]
name = "telegram"
url = "https://t.me/elchintoyirov"

[[extra.profile.social]]
name = "twitter"
url = "https://x.com/elchintoyirov"

[[extra.profile.social]]
name = "rss"
url = "$BASE_URL/atom.xml"

[[extra.menu]]
name = "About"
url = "$BASE_URL/about"

[[extra.menu]]
name = "Projects"
url = "$BASE_URL/projects"

[[extra.menu]]
name = "Tags"
url = "$BASE_URL/tags"

[[extra.menu]]
name = "Archive"
url = "$BASE_URL/archive"

[[extra.menu]]
name = "Resume"
url = "$BASE_URL/resume.pdf"
