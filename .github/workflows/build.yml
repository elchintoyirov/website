name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ZOLA_VERSION: 0.22.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zola
        run: |
          set -euo pipefail
          url="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLf -o zola.tar.gz "$url"
          tar -xzf zola.tar.gz zola
          sudo install -m 0755 zola /usr/local/bin/zola
          rm -f zola.tar.gz zola
          zola --version

      - name: Build
        run: |
          set -euo pipefail
          zola build
          test -f public/index.html
